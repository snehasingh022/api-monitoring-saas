services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — Auth Service Database
  # ---------------------------------------------------------------------------
  auth-db:
    image: postgres:16-alpine
    container_name: api-tracker-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    ports:
      - "${AUTH_DB_PORT:-5434}:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - api-tracker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # PostgreSQL — Monitor Service Database
  # ---------------------------------------------------------------------------
  monitor-db:
    image: postgres:16-alpine
    container_name: api-tracker-monitor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MONITOR_DB_USER}
      POSTGRES_PASSWORD: ${MONITOR_DB_PASSWORD}
      POSTGRES_DB: ${MONITOR_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - monitor_db_data:/var/lib/postgresql/data
    networks:
      - api-tracker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MONITOR_DB_USER} -d ${MONITOR_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis — Caching, rate limiting, latest monitor results
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: api-tracker-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - api-tracker-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  auth-service:
    build:
      context: ./services/auth-service
    container_name: api-tracker-auth-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./services/auth-service/.env
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - api-tracker-network 

  monitor-service:
    build:
      context: ./services/monitor-service
    container_name: api-tracker-monitor-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - ./services/monitor-service/.env
    depends_on:
      monitor-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - api-tracker-network

  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: api-tracker-api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./services/api-gateway/.env
    depends_on:
      auth-service:
        condition: service_started
      monitor-service:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - api-tracker-network

  notification-service:
    build:
      context: ./services/notification-service
    container_name: api-tracker-notification-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    env_file:
      - ./services/notification-service/.env
    networks:
      - api-tracker-network

  frontend:
    build:
      context: ./frontend
    container_name: api-tracker-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - api-tracker-network

networks:
  api-tracker-network:
    driver: bridge

volumes:
  auth_db_data:
  monitor_db_data:
  redis_data:
